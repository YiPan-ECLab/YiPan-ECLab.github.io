locale: en-US
site_theme: default
title: Yi Pan
name: Yi Pan
description: "Research in WAM, vision-language-action models, world models, and embodied intelligence."
url: "https://yipan-eclab.github.io"
baseurl: ""
repository: "YiPan-ECLab/YiPan-ECLab.github.io"
timezone: Asia/Shanghai
author:
  name: Yi Pan
  bio: MS student · Artificial Intelligence
  avatar: ""
  googlescholar: "https://scholar.google.com/citations?user=ecJFt9sAAAAJ&hl=en"
  email: panyi0304@gmail.com
  openreview: "https://openreview.net/profile?id=~Yi_Pan9"
