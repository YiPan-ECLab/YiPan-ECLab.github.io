include: [_pages]
exclude: [vendor, work, scripts, tests, .bundle, .github, Gemfile, Gemfile.lock, README.md, TEMPLATE.md, SOURCES.md, AGENTS.md, LICENSE, LICENSE.acadhomepage, node_modules, package.json, package-lock.json]
collections:
  publications:
    output: true
    permalink: /publications/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: default
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  sass_dir: _sass
  style: compressed
plugins: [jekyll-sitemap, jekyll-feed, jekyll-redirect-from]
atom_feed:
  hide: true
analytics:
  provider: false
compress_html:
  clippings: all
  ignore:
    envs: development
