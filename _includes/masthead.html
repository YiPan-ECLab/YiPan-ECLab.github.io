<a href="#main-content" class="skip-link">Skip to content</a>
<header class="research-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.name }}<span class="wordmark-dot">.</span></a>
    <nav aria-label="Main navigation">{% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}">{{ link.title }}</a>{% endfor %}</nav>
    <button class="color-toggle" id="color-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button>
  </div>
</header>
